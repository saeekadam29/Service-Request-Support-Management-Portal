{% extends 'base.html' %}
{% block title %}Delete Ticket{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="section-card text-center">
            <i class="bi bi-exclamation-triangle text-danger" style="font-size: 2.5rem;"></i>
            <h4 class="fw-bold mt-3">Delete Ticket #{{ ticket.id }}?</h4>
            <p class="text-muted">"{{ ticket.title }}" will be permanently deleted, along with its comments and history. This cannot be undone.</p>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger"><i class="bi bi-trash me-1"></i> Yes, Delete</button>
                <a href="{% url 'tickets:ticket_detail' ticket.pk %}" class="btn btn-light">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
