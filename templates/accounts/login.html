{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="auth-wrapper">
    <div class="auth-card card">
        <div class="auth-icon"><i class="bi bi-shield-lock-fill"></i></div>
        <h3 class="fw-bold mb-1">Welcome back</h3>
        <p class="text-muted mb-4">Sign in to manage your service requests.</p>

        {% if form.errors %}
        <div class="alert alert-danger py-2">Please enter a correct username and password.</div>
        {% endif %}

        <form method="post" novalidate>
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-semibold">Username</label>
                <input type="text" name="username" class="form-control" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 mt-2">
                <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
            </button>
        </form>
        <p class="text-center mt-4 mb-0 text-muted">
            Don't have an account? <a href="{% url 'accounts:register' %}" class="fw-semibold text-decoration-none">Create one</a>
        </p>
    </div>
</div>
{% endblock %}
